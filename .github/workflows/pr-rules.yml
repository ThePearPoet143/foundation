# The foundation's PR rules, for other repos to call:
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened, labeled, unlabeled]
#   jobs:
#     rules:
#       uses: ThePearPoet143/foundation/.github/workflows/pr-rules.yml@v0.3.0
#       permissions:            # the size check labels the PR; the report comments on it
#         contents: read
#         issues: write
#         pull-requests: write
#       with:
#         issue-prefix: SUS
#         checks: text, size     # default: text
#         guardrails-enforce: ${{ vars.GUARDRAILS_ENFORCE }}   # for the guardrails check: "true" fails, else dry-run
#       secrets:
#         LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}       # for the guardrails check
# Any repo can call it: "The called workflow is stored in a public repository" (GitHub, Reusing workflow configurations).
# A called workflow can't raise the caller's permissions ("permissions can only be maintained or reduced"), so a repo
# grants the size check's permissions itself.
# Dependabot's pull requests (SUS-44) run only the size check: a bot writes no issue key, sections or model line. They
# are found as GitHub's own example does: github.event.pull_request.user.login == 'dependabot[bot]' (GitHub,
# Automating Dependabot with GitHub Actions).
name: pr-rules

on:
  workflow_call:
    inputs:
      issue-prefix:
        description: The repo's Linear issue key, such as SUS or GDS.
        type: string
        required: true
      checks:
        description: The checks to run, separated by commas. text (SUS-27); size (SUS-28); branch (SUS-29); guardrails (SUS-71).
        type: string
        default: text
      guardrails-enforce:
        description: '"true" makes the guardrails check fail on a problem; anything else only warns (dry-run).'
        type: string
        default: 'false'
      size-extra-ignored:
        description: More paths the size check leaves out, as globs separated by commas.
        type: string
        default: ''
    secrets:
      LINEAR_API_KEY:
        description: A Linear API key that can read the repo's issues, for the guardrails check.
        required: false

jobs:
  text:
    if: contains(inputs.checks, 'text') && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: ThePearPoet143/foundation/.github/actions/text-check@v0.3.0
        id: check
        with:
          issue-prefix: ${{ inputs.issue-prefix }}

  size:
    if: contains(inputs.checks, 'size')
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ThePearPoet143/foundation/.github/actions/size@v0.3.0
        id: check
        with:
          extra-ignored: ${{ inputs.size-extra-ignored }}

  branch:
    if: contains(inputs.checks, 'branch') && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ThePearPoet143/foundation/.github/actions/branch@v0.3.0
        id: check
        with:
          issue-prefix: ${{ inputs.issue-prefix }}

  # Releases (dev into main) carry many issues, checked on their way into dev; Dependabot writes no issue (SUS-65 later).
  guardrails:
    if: >-
      contains(inputs.checks, 'guardrails') && github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ThePearPoet143/foundation/.github/actions/guardrails@v0.3.0
        id: check
        with:
          issue-prefix: ${{ inputs.issue-prefix }}
          enforce: ${{ inputs.guardrails-enforce }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}

  # One comment on the pull request saying what each check found, edited on every push (SUS-73). It runs after the
  # checks whatever they did; a check this repo doesn't run shows as not run.
  report:
    if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: [text, size, branch, guardrails]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: ThePearPoet143/foundation/.github/actions/report@v0.3.0
        with:
          needs-json: ${{ toJSON(needs) }}
