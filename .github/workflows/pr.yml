# The foundation checks its own pull requests with the actions from the PR itself, so every change tests itself.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

jobs:
  text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/text-check
        with:
          issue-prefix: SUS

  size:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/size

  branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/branch
        with:
          issue-prefix: SUS

  guardrails:
    if: github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/guardrails
        with:
          issue-prefix: SUS
          enforce: ${{ vars.GUARDRAILS_ENFORCE }}
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
