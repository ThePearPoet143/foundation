# The branch and commit checks as a composite action (SUS-29). The job that uses it checks out the PR with its history
# (fetch-depth: 0), so the PR's commits can be read.
name: Branch and commit checks
description: Fails a PR into main that isn't a release from dev, and a commit without its issue key.
inputs:
  issue-prefix:
    description: The repo's Linear issue key, such as SUS or GDS.
    required: true
runs:
  using: composite
  steps:
    - name: Check the target branch and the commits
      shell: pwsh
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BODY: ${{ github.event.pull_request.body }}
        ISSUE_PREFIX: ${{ inputs.issue-prefix }}
      run: '& "$env:GITHUB_ACTION_PATH/Invoke-Branch.ps1"'